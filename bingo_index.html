
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Observatory Bingo</title>
  <link rel="stylesheet" href="bingo_style.css">
</head>
<body>

  <main class="bingo-stage" aria-label="The Observatory Bingo game">
    <div class="game-overlay">

      <!-- USERNAME INPUT -->
      <section class="overlay-zone username-zone" id="usernameSection">
        <form id="usernameForm" class="username-form">

          <label class="sr-only" for="usernameInput">
            Twitch username
          </label>

          <input
            id="usernameInput"
            type="text"
            autocomplete="off"
            placeholder="Twitch username"
            maxlength="30"
            required
          >

          <button type="submit" aria-label="Start Bingo">
            START
          </button>

        </form>

        <p id="usernameError"
           class="inline-message"
           aria-live="polite">
        </p>
      </section>


      <!-- PLAYER INFORMATION -->
      <section
        class="overlay-zone player-zone hidden"
        id="playerInfo"
      >

        <div id="playerNameDisplay" class="player-name">
          —
        </div>

        <div id="cardNumber" class="card-number">
          #1
        </div>

      </section>


      <!-- LEFT SIDE CONTROLS -->
      <section class="overlay-zone controls-zone">

        <button
          id="newCardButton"
          class="zone-button"
          type="button"
          disabled
          aria-label="Get a new Bingo card"
        ></button>

        <button
          id="clearButton"
          class="zone-button"
          type="button"
          disabled
          aria-label="Clear Bingo marks"
        ></button>

        <button
          id="rulesButton"
          class="zone-button"
          type="button"
          aria-label="Show how to play"
        ></button>

      </section>


      <!-- CENTER BINGO CARD -->
      <section class="overlay-zone card-zone">

        <p
          id="statusMessage"
          class="status-message"
          aria-live="polite"
        >
          Enter your Twitch username to begin.
        </p>

        <div
          id="bingoCard"
          class="bingo-card"
          aria-label="Bingo card"
        ></div>

      </section>


      <!-- RIGHT SIDE CLAIM AREA -->
      <!-- Claim is done with !bingo in Twitch chat -->

      <section
        class="overlay-zone claim-zone"
        id="claimSection"
      >

        <p
          id="claimStatus"
          class="claim-status"
          aria-live="polite"
        >
          Complete a Bingo to unlock your claim.
        </p>

        <div
          id="claimResult"
          class="claim-result hidden"
          aria-live="polite"
        >

          <strong id="claimFinalMessage"></strong>

          <span id="claimChatCommand">
            !bingo
          </span>

        </div>

      </section>


      <!-- HOW TO PLAY PANEL -->

      <section
        id="rulesPanel"
        class="rules-overlay hidden"
        aria-live="polite"
      >

        <button
          id="closeRulesButton"
          class="close-rules"
          type="button"
          aria-label="Close how to play"
        >
          ×
        </button>

        <h2>HOW TO PLAY</h2>

        <ol>
          <li>Watch the stream.</li>
          <li>Tap a square when it happens.</li>
          <li>Get 5 in a row in any direction.</li>
          <li>Type <strong>!bingo</strong> in Twitch chat.</li>
          <li>Have fun and embrace the chaos!</li>
        </ol>

      </section>

    </div>
  </main>

  <script src="bingo_app.js"></script>

</body>
</html>
