<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>The Observatory Bingo</title>

  <link
    rel="stylesheet"
    href="bingo_style.css"
  >
</head>

<body>

  <main
    class="bingo-stage"
    aria-label="The Observatory Bingo game"
  >

    <div class="game-overlay">

      <!-- =================================================
           NAME INPUT
           TOP BLUE BOX ON LEFT
      ================================================== -->

      <section
        id="usernameSection"
        class="overlay-zone username-zone"
      >

        <form
          id="usernameForm"
          class="username-form"
        >

          <label
            class="sr-only"
            for="usernameInput"
          >
            Twitch username
          </label>

          <input
            id="usernameInput"
            type="text"
            placeholder="Twitch username"
            autocomplete="off"
            maxlength="30"
            required
          >

          <button
            type="submit"
            aria-label="Start Bingo"
          >
            START
          </button>

        </form>

        <!-- This replaces the input after START is pressed -->
        <div
          id="activeUsernameBox"
          class="active-username-box hidden"
        ></div>

        <p
          id="usernameError"
          class="inline-message"
          aria-live="polite"
        ></p>

      </section>


      <!-- =================================================
           CARD NUMBER
           PINK BOX UNDER NAME BOX
      ================================================== -->

      <section
        id="playerInfo"
        class="overlay-zone player-zone hidden"
      >

        <div
          id="cardNumber"
          class="card-number"
        >
          #1
        </div>

      </section>


      <!-- =================================================
           LEFT BOTTOM BUTTONS
           THREE ARTWORK BOXES:
           1. NEW CARD
           2. CLEAR CARD
           3. EMPTY NOTEPAD BOX
      ================================================== -->

      <section
        class="overlay-zone controls-zone"
      >

        <button
          id="newCardButton"
          class="zone-button"
          type="button"
          disabled
          aria-label="Get a new Bingo card"
        >
          NEW CARD
        </button>

        <button
          id="clearButton"
          class="zone-button"
          type="button"
          disabled
          aria-label="Clear Bingo marks"
        >
          CLEAR CARD
        </button>

        <!-- Deliberately empty. The How To Play button is gone. -->

      </section>


      <!-- =================================================
           CENTER BINGO CARD
      ================================================== -->

      <section
        class="overlay-zone card-zone"
      >

        <p
          id="statusMessage"
          class="status-message"
          aria-live="polite"
        >
          Enter your Twitch username to begin.
        </p>

        <div
          id="bingoCard"
          class="bingo-card"
          aria-label="Bingo card"
        ></div>

      </section>


      <!-- =================================================
           RIGHT YELLOW BINGO STATUS BOX
      ================================================== -->

      <section
        id="claimSection"
        class="overlay-zone claim-zone"
      >

        <p
          id="claimStatus"
          class="claim-status"
          aria-live="polite"
        >
          Complete a Bingo to unlock your claim.
        </p>

        <div
          id="claimResult"
          class="claim-result hidden"
          aria-live="polite"
        >

          <strong
            id="claimFinalMessage"
          ></strong>

          <span
            id="claimChatCommand"
          >
            !bingo
          </span>

        </div>

      </section>

    </div>

  </main>


  <script src="bingo_app.js"></script>

</body>
</html>
